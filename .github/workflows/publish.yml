name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    # Same services as CI: a release is gated on the suite passing against every
    # supported driver, not just SQLite.
    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: bunny_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bunny
          POSTGRES_PASSWORD: bunny
          POSTGRES_DB: bunny_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U bunny"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/bunny_test
          POSTGRES_TEST_URL: postgresql://bunny:bunny@127.0.0.1:5432/bunny_test
        run: bun run test

      - name: Determine next version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          bun - <<'BUN' >> "$GITHUB_OUTPUT"
          const { version: current } = await Bun.file("package.json").json();
          const previousPackage = Bun.spawnSync(["git", "show", `${process.env.BEFORE_SHA}:package.json`]);
          const previous = previousPackage.exitCode === 0
            ? JSON.parse(previousPackage.stdout.toString()).version
            : current;
          const parts = String(current).split(".").map((part) => Number(part));
          const major = Number.isFinite(parts[0]) ? parts[0] : 0;
          const minor = Number.isFinite(parts[1]) ? parts[1] : 0;
          const patch = Number.isFinite(parts[2]) ? parts[2] : 0;
          const next = process.env.GITHUB_EVENT_NAME === "push" && previous !== current
            ? current
            : `${major}.${minor}.${patch + 1}`;

          console.log(`current=${current}`);
          console.log(`next=${next}`);
          BUN

      - name: Update package version
        if: ${{ steps.version.outputs.current != steps.version.outputs.next }}
        run: bun pm version "${{ steps.version.outputs.next }}" --no-git-tag-version

      - name: Publish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish --access public

      - name: Commit version bump
        if: ${{ steps.version.outputs.current != steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${{ steps.version.outputs.next }} [skip ci]"
          git push origin HEAD:main
